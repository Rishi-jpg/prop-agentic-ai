[project]
name = "prop-agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rishi", email = "rishi.joshi@creysto.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.7",
    "fastmcp>=4.2.3",
    "httpx>=0.28.1",
    "langfuse>=5.2.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
prop-agentic-ai = "prop_agentic_ai:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
